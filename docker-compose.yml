version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: snippet_db
    restart: always
    ports:
      - "5000:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - snippet_net

  backend:
    build: ./backend
    container_name: snippet_backend
    restart: always
    environment:
      PORT: ${BACKEND_PORT}
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - snippet_net

  frontend:
    build: ./frontend
    container_name: snippet_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - snippet_net

volumes:
  postgres_data:

networks:
  snippet_net:
    driver: bridge